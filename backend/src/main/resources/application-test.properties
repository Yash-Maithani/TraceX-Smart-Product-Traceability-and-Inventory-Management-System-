# Test Profile
server.port=${SERVER_PORT:8082}
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/tracex_fresh_test}

tracex.seed.enabled=${SEED_ENABLED:true}
tracex.seed.default-password=${SEED_DEFAULT_PASSWORD:TestPass123456!}
tracex.security.frontend-url=${FRONTEND_URL:http://localhost:5174}
tracex.security.jwt-secret=${JWT_SECRET:test_secret_key_must_be_at_least_32_bytes_long_123456}

springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# Actuator: show health details in test profile so testActuatorHealthReportsDatabaseUp can see db component
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
