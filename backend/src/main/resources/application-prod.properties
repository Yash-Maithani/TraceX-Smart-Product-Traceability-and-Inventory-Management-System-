# Production Profile
server.port=${SERVER_PORT:8081}
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/tracex_fresh}

tracex.security.jwt-secret=${JWT_SECRET:}
tracex.security.frontend-url=${FRONTEND_URL:}
tracex.security.public-trace-base-url=${PUBLIC_TRACE_BASE_URL:}

tracex.seed.enabled=${SEED_ENABLED:false}
tracex.seed.default-password=${SEED_DEFAULT_PASSWORD:}

server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:native}

springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:false}
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:false}

tracex.mail.sink.enabled=false

