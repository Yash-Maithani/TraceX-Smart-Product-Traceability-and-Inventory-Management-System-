# Base Application Properties
spring.application.name=tracex-backend
# Local secrets (Phase 11): an untracked backend/.env file (KEY=value lines) is read if present.
# It is git-ignored; production sets the same names as real environment variables instead.
spring.config.import=optional:file:.env[.properties]
# No default profile: an unset SPRING_PROFILES_ACTIVE runs with production rules (AppConfig fail-fast).
# Local development must opt in with -Dspring-boot.run.profiles=dev.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:}

# Server
server.port=${SERVER_PORT:8081}

# Request Size Limit
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Actuator: expose only health
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# OpenAPI Documentation
springdoc.swagger-ui.path=/api/v1/docs
springdoc.api-docs.path=/api/v1/api-docs
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.paths-to-exclude=/api/v1/test/**

# Security & CORS Defaults
tracex.security.jwt-secret=${JWT_SECRET:}
tracex.security.trace-token-secret=${TRACE_TOKEN_SECRET:}
tracex.security.frontend-url=${FRONTEND_URL:http://localhost:5174}
tracex.security.public-trace-base-url=${PUBLIC_TRACE_BASE_URL:http://localhost:5174}

# Rate Limits
tracex.rate-limit.trace=${RATE_LIMIT_TRACE:60}
tracex.rate-limit.scan=${RATE_LIMIT_SCAN:60}
tracex.rate-limit.report=${RATE_LIMIT_REPORT:5}
tracex.rate-limit.verify-otp=${RATE_LIMIT_VERIFY_OTP:20}
# Every /api/ request from one address, per 15 minutes (SPEC section 7, Phase 13)
tracex.rate-limit.global=${RATE_LIMIT_GLOBAL:500}

# Seed Configuration
tracex.seed.enabled=${SEED_ENABLED:false}
tracex.seed.default-password=${SEED_DEFAULT_PASSWORD:}

# Forward Headers Strategy (off in base, dev, test)
server.forward-headers-strategy=none

# Mail & Dev Mail Sink Configuration
# Real SMTP by default; only the dev, test and e2e profiles write mail to the local sink
tracex.mail.sink.enabled=${MAIL_SINK_ENABLED:false}
tracex.mail.sink.dir=target/dev-mail
tracex.mail.from-name=${EMAIL_FROM_NAME:TraceX Platform}
tracex.mail.from-addr=${EMAIL_FROM_ADDR:noreply@tracex.demo}

spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}


tracex.business.timezone=${BUSINESS_TIME_ZONE:Asia/Kolkata}
tracex.import.stale-running-minutes=${IMPORT_STALE_RUNNING_MINUTES:15}

spring.data.mongodb.auto-index-creation=true

# AI features (Phase 11, reworked in the AI phase). Off unless at least one key is set.
# Gemini models are tried in order: a retired (404), busy (503) or rate-limited (429) model hands over to the next.
tracex.ai.gemini.api-key=${GEMINI_API_KEY:}
tracex.ai.gemini.models=${GEMINI_MODELS:gemini-flash-lite-latest,gemini-3.5-flash,gemini-flash-latest}
tracex.ai.nvidia.api-key=${NVIDIA_API_KEY:}
tracex.ai.nvidia.model=${NVIDIA_MODEL:meta/llama-3.1-70b-instruct}
tracex.ai.cache-ttl-hours=${GEMINI_CACHE_TTL_HOURS:4}
tracex.rate-limit.ai-audit=${RATE_LIMIT_AI_AUDIT:5}

# Google sign-in (Phase 11, S-07). Off unless set; must match VITE_GOOGLE_CLIENT_ID in the frontend.
tracex.google.client-id=${GOOGLE_CLIENT_ID:}
