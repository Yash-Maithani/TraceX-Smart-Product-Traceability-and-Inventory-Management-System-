spring.profiles.active=test
server.port=8082
spring.data.mongodb.uri=mongodb://localhost:27017/tracex_fresh_test

tracex.security.jwt-secret=test_jwt_secret_key_must_be_at_least_32_chars_long_12345
tracex.security.frontend-url=http://localhost:5174
tracex.security.public-trace-base-url=http://localhost:5174

tracex.seed.enabled=false
tracex.mail.sink.enabled=true
tracex.rate-limit.verify-otp=1000
tracex.seed.default-password=TestPass123456!
server.forward-headers-strategy=none

springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/api/v1/api-docs
springdoc.paths-to-exclude=/api/v1/test/**
tracex.ai.gemini.api-key=
tracex.ai.nvidia.api-key=
tracex.google.client-id=
tracex.rate-limit.global=100000
